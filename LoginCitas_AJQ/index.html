<!DOCTYPE html> <!-- Define el tipo de documento HTML 5 -->
<html lang="en"> <!-- Idioma del documento -->
<head> <!-- Inicio del encabezado -->

    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0"> <!-- Vista adaptable a dispositivos -->
    <title>Dating Login</title> <!-- Titulo de la pagina -->
    <link rel="stylesheet" href="style.css"> <!-- Enlaza el CSS -->
</head> <!-- Fin del encabezado -->
<body> <!-- Inicio del cuerpo-->
    <div class="card"><!-- Tarjeta del formulario -->
        <h2> Date </h2> <!-- Titulo del icono -->

            <!-- Campo de texto para usuario -->
             <input type="password" placeholder="Password">
             <!-- Campo de contraseñas -->

        </form> <!-- Fin del formulario -->
    </div> <!-- Fin de la tarjeta -->
</body> <!-- Fin del cuerpo -->
