 <!DOCTYPE html>  <!-- Define el tipo de documento HTML5 -->
<html lang="es">  <!-- Idioma del documento -->
<head>
    <meta charset="UTF-8">  <!-- Codificación de caracteres -->
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">  <!-- Vista adaptable a dispositivos -->
    <title>Postal</title>  <!-- Título de la página -->
    <link rel="stylesheet" href="style.css">  <!-- Enlaza el CSS -->
</head>
<body>
    <div class="postcard">  <!-- Contenedor principal de la postal -->
        <div class="left-side">  <!-- Lado izquierdo (mensaje) -->
        </div>
        <div class="right-side">  <!-- Lado derecho (dirección) -->
            <div class="stamp-box"></div><!-- Cuadro de estampilla -->
            <div class="address-lines">  <!-- Líneas de dirección -->
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </div>
    </div>
</body>
</html>
