 <!DOCTYPE html><!-- Define el tipo de documento HTML5 -->
<html lang="es"><!-- Idioma de la página -->
<head><!-- Inicio del encabezado -->
    <meta charset="UTF-8"><!-- Codificación de caracteres -->
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0"><!-- Vista adaptable a dispositivos -->
    <title>Glass Login</title><!-- Titulo de la página -->
    <link rel="stylesheet" href="style.css"><!-- Enlaza el CSS -->
</head><!-- Fin del encabezado -->
<body><!-- Inicio del cuerpo -->
    <!-- Contenedor principal del login -->
    <div class="glass-card">
        <!-- Titulo de bienvenida -->
        <h2>Welcome</h2>
        <!-- Inicio del formulario -->
        <form>
            <!-- Campo de correo electrónico -->
            <input type="text" placeholder="Email" required>
            <!-- Campo de contraseña -->
            <input type="password" placeholder="Password" required>
            <!-- Botón de envío -->
            <button type="submit">Sign In</button>
        </form><!-- Fin del formulario -->
    </div><!-- Fin del contenedor -->
</body><!-- Fin del cuerpo -->
</html><!-- Fin del documento -->
