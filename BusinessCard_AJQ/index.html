<!DOCTYPE html> <!-- Define el tipo de documento HTML5 -->
<html lang="en"> <!-- Idioma de la página: inglés -->
<head> <!-- Inicio del encabezado -->
    <meta charset="UTF-8"> <!-- Codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Vista adaptable a dispositivos -->
    <title>Business Card</title> <!-- Título de la página -->
    <link rel="stylesheet" href="style.css"> <!-- Enlaza el archivo CSS -->
    <link rel="shortcut icon" href="persona.png" type="image/x-icon">
</head> <!-- Fin del encabezado -->
<body> <!-- Inicio del cuerpo -->
    <div class="card"> <!-- Contenedor principal de la tarjeta -->
        <div class="left"> <!-- Parte izquierda (foto) -->
            <!-- Reemplazamos la div vacía por la etiqueta img -->
            <img src="yo.jpg" alt="Foto de perfil" class="photo">
        </div> <!-- Fin de la parte izquierda -->
        <div class="right"> <!-- Parte derecha (información) -->
            <h2>Alessita de Estrada </h2> <!-- Nombre -->
            <p class="title">Web Developer</p> <!-- Cargo o profesión -->
            <div class="info"> <!-- Contenedor de la información -->
                <div>+1 (123) 456-7890</div> <!-- Teléfono -->
                <div>alessona@gmail.com</div> <!-- Email -->
                <div>www.alessona.com</div> <!-- Sitio web -->
            </div>
        </div> <!-- Fin de la parte derecha -->
    </div> <!-- Fin del contenedor principal -->
</body> <!-- Fin del cuerpo -->
</html> <!-- Fin del documento HTML -->
